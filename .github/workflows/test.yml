name: Build detailed bathroom SKP

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-skp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout model source
        uses: actions/checkout@v4

      - name: Checkout SketchUp SDK
        uses: actions/checkout@v4
        with:
          repository: Vaalasar/SketchUp-SDK-2024
          ref: main
          path: sdk

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile detailed native SKP builder
        shell: pwsh
        run: |
          cmd /c "cl /nologo /EHsc /std:c++17 /I sdk\headers /I skp_build skp_build\build_bano_detallado.cpp /Fe:build_bano_detallado.exe /link /LIBPATH:sdk\binaries\sketchup\x64 SketchUpAPI.lib > compile.log 2>&1"
          Get-Content compile.log
          if ($LASTEXITCODE -ne 0) { throw "Compilacion fallida" }

      - name: Generate detailed SketchUp file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output -Force | Out-Null
          Copy-Item sdk\binaries\sketchup\x64\SketchUpAPI.dll . -Force
          Copy-Item sdk\binaries\sketchup\x64\SketchUpCommonPreferences.dll . -Force
          .\build_bano_detallado.exe output\bano_1x2_detallado.skp
          if ($LASTEXITCODE -ne 0) { throw "El generador SKP termino con codigo $LASTEXITCODE" }
          $file = Get-Item output\bano_1x2_detallado.skp
          if ($file.Length -lt 10000) { throw "El archivo SKP generado es demasiado pequeno" }
          $file | Format-List Name,Length,FullName

      - name: Upload detailed SKP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bano-1x2-detallado-skp
          path: output/bano_1x2_detallado.skp
          if-no-files-found: error
          retention-days: 1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-log
          path: compile.log
          if-no-files-found: ignore
          retention-days: 1
